<p-toolbar styleClass="mb-4 shadow-2">
<ng-template pTemplate="start">
        <div class="flex align-items-center gap-4">

            <div class="flex align-items-center gap-2">
                <i class="pi pi-book text-2xl text-primary"></i>
                <span class="font-bold text-xl text-primary">
                    {{ 'APP_NAME' | translate }}
                </span>
            </div>

            <div class="flex align-items-center gap-2"> 
                <p-button 
                    *ngIf="!isLoggedIn"
                    label="{{ 'NAVBAR.LOGIN' | translate }}" 
                    icon="pi pi-sign-in" 
                    [rounded]="true"
                    (click)="login()">
                </p-button>

                <p-button 
                    *ngIf="isLoggedIn"
                    label="{{ 'NAVBAR.LOGOUT' | translate }}" 
                    icon="pi pi-sign-out" 
                    [rounded]="true" 
                    severity="danger"
                    [outlined]="true"
                    (click)="logout()">
                </p-button>  
            </div>

        </div>
    </ng-template>


    <ng-template pTemplate="end">
        <div class="flex align-items-center gap-2">
            
            <p-button 
                [label]="languageService.currentLang() === 'en' ? 'عربي' : 'English'" 
                icon="pi pi-language" 
                [text]="true" 
                [rounded]="true"
                (click)="languageService.toggleLanguage()">
            </p-button>

            <p-button 
        [icon]="isDarkMode ? 'pi pi-sun' : 'pi pi-moon'" 
        [rounded]="true" 
        [text]="true"
        severity="secondary"
        (click)="toggleTheme()"
        pTooltip="Switch Theme"
        tooltipPosition="bottom">
        </p-button>



        </div>
    </ng-template>
</p-toolbar>
