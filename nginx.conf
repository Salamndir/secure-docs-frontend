server {
    listen 80;
    server_name localhost;

    # Root directory where the built Angular files are stored inside the container
    root /usr/share/nginx/html;

    # The entry point file
    index index.html;

    # =========================================================
    # GZIP COMPRESSION
    # Compresses files to reduce data transfer and speed up loading
    # =========================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================
    # SPA ROUTING (Single Page Application)
    # =========================================================
    location / {
        # The Magic Line:
        # 1. Try to find the requested file ($uri) -> e.g., image.png
        # 2. If not found, try to find a directory ($uri/)
        # 3. If neither exists, serve index.html (Angular handles the routing internally)
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # CACHING STATIC ASSETS
    # Images, Fonts, and Styles won't change often, so cache them for 1 year
    # =========================================================
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
